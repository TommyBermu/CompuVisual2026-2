<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smash Hit 3D</title>
    <link rel="stylesheet" href="css/style.css" />

    <!--
    Three.js y Cannon-es desde CDN como módulos ES (sin instalar nada).
    Three.js moderno hace imports internos del tipo `import ... from 'three'`,
    por eso necesitamos un import map que resuelva esos nombres a URLs del CDN.
    En los .js importamos con nombres limpios: `import * as THREE from 'three'`.
  -->
    <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
</head>

<body>
    <!-- Three.js inyecta el <canvas> aquí -->
    <div id="game"></div>

    <!-- HUD en HTML por encima del canvas (ver css/style.css) -->
    <div id="hud"></div>

    <!-- Punto de entrada -->
    <script type="module" src="src/main.js"></script>
</body>

</html>
