<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DLSS · De la supermuestra espacial al renderizado neuronal</title>
  <meta name="description"
    content="Presentación técnica sobre NVIDIA DLSS: evolución desde DLSS 1.0 (2018) hasta DLSS 5 (2026), arquitectura, comparativas y debates." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <!-- Fondo animado (canvas de partículas/flujo) -->
  <canvas id="bg"></canvas>

  <!-- Barra de progreso superior -->
  <div id="progress"><span id="progress-bar"></span></div>

  <!-- Contenedor de slides (lo llena app.js) -->
  <main id="deck" aria-live="polite"></main>

  <!-- Controles de navegación -->
  <nav id="controls" aria-label="Navegación de diapositivas">
    <button id="prev" aria-label="Anterior">&#8592;</button>
    <span id="counter"><b id="cur">1</b> / <span id="total">1</span></span>
    <button id="next" aria-label="Siguiente">&#8594;</button>
    <button id="toc-btn" aria-label="Índice">&#9776;</button>
  </nav>

  <!-- Índice / tabla de contenidos (overlay) -->
  <div id="toc" class="hidden" role="dialog" aria-label="Índice de contenidos">
    <div class="toc-inner">
      <h2>Índice</h2>
      <ol id="toc-list"></ol>
      <button id="toc-close" aria-label="Cerrar índice">Cerrar</button>
    </div>
  </div>

  <!-- Ayuda de teclado -->
  <div id="hint">← → espacio · <b>F</b> pantalla completa · <b>M</b> índice</div>

  <script type="module" src="js/app.js"></script>
</body>

</html>
